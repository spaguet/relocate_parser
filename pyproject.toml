[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relocate-helper"
version = "0.1.0"
description = "AI assistant for travelers and expats — knowledge base, bot, and admin panel"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "relocate_helper team" }]
dependencies = [
    "aiobotocore>=2.13.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pgvector>=0.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "redis>=5.0.0",
    "rq>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "types-redis>=4.6.0",
]

[project.scripts]
relocate-helper-api = "relocate_helper.main:main"
relocate-helper-worker = "relocate_helper.workers.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/relocate_helper"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["relocate_helper"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["aiobotocore.*", "asyncpg.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["relocate_helper"]
